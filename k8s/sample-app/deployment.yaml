apiVersion: v1
kind: ConfigMap
metadata:
  name: vivek-pod-platform-html
  namespace: sample-app
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Vivek Pod Platform Proj - Enterprise Kubernetes & CI/CD Platform</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
      <style>
        :root {
          --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
          --card-bg: rgba(15, 23, 42, 0.75);
          --card-border: rgba(255, 255, 255, 0.1);
          --accent-cyan: #38bdf8;
          --accent-emerald: #10b981;
          --accent-indigo: #818cf8;
          --accent-amber: #f59e0b;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          background: var(--bg-gradient);
          color: var(--text-main);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 40px 20px;
        }
        .container { max-width: 1000px; width: 100%; }
        header { text-align: center; margin-bottom: 40px; }
        .badge-hero {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 16px;
          background: rgba(16, 185, 129, 0.15);
          border: 1px solid rgba(16, 185, 129, 0.4);
          color: var(--accent-emerald);
          font-size: 0.85rem;
          font-weight: 700;
          border-radius: 9999px;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          margin-bottom: 16px;
        }
        .badge-hero::before {
          content: '';
          width: 8px;
          height: 8px;
          background-color: var(--accent-emerald);
          border-radius: 50%;
          box-shadow: 0 0 10px var(--accent-emerald);
        }
        h1 {
          font-size: 2.8rem;
          font-weight: 800;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 12px;
        }
        .subtitle { font-size: 1.15rem; color: var(--text-muted); max-width: 650px; margin: 0 auto; line-height: 1.6; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
          background: var(--card-bg);
          backdrop-filter: blur(16px);
          border: 1px solid var(--card-border);
          border-radius: 16px;
          padding: 28px;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .card h3 { font-size: 1.2rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px; }
        .card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        .metrics-panel {
          background: var(--card-bg);
          backdrop-filter: blur(16px);
          border: 1px solid var(--card-border);
          border-radius: 16px;
          padding: 32px;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
          margin-bottom: 30px;
        }
        .metrics-title { font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin-bottom: 20px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .metric-box { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 18px; }
        .metric-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: var(--accent-cyan); }
        .arch-diagram {
          background: #090d16;
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px;
          padding: 20px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.85rem;
          color: #38bdf8;
          overflow-x: auto;
          white-space: pre;
          line-height: 1.4;
          margin-top: 16px;
        }
        footer { margin-top: 30px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div class="badge-hero">Production Ready & Deployed</div>
          <h1>Vivek Pod Platform Proj</h1>
          <p class="subtitle">
            GitOps-driven Kubernetes CI/CD Platform powered by Jenkins Configuration-as-Code (JCasC), KinD, and Ephemeral Agent Pods.
          </p>
        </header>

        <div class="grid-cards">
          <div class="card">
            <h3>⚡ Ephemeral Build Pods</h3>
            <p>Build agents dynamically spin up on-demand as Kubernetes pods (<code>jnlp</code> + sidecars) and self-destruct immediately after build completion.</p>
          </div>

          <div class="card">
            <h3>🔐 Zero-UI GitOps JCasC</h3>
            <p>100% of Jenkins configuration, RBAC matrix (Admin, Developer, Auditor), and Kubernetes credentials are seeded via Code with zero manual UI steps.</p>
          </div>

          <div class="card">
            <h3>📦 Zero-Cost Registry</h3>
            <p>Integrates a local container registry on port <code>5001</code> linked directly with the KinD cluster for rapid image pushes and deployments.</p>
          </div>
        </div>

        <div class="metrics-panel">
          <div class="metrics-title">📊 Platform Status & Cluster Specs</div>
          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-label">Environment</div>
              <div class="metric-value">KinD / Proxmox VM</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Orchestrator</div>
              <div class="metric-value">Kubernetes 1.29</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Namespace</div>
              <div class="metric-value" style="color: var(--accent-emerald);">sample-app</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Service Port</div>
              <div class="metric-value" style="color: var(--accent-amber);">NodePort 30081</div>
            </div>
          </div>

          <div class="arch-diagram">
    +-----------------------------------------------------------------------------------+
    |                            VIVEK POD PLATFORM ARCHITECTURE                        |
    +-----------------------------------------------------------------------------------+
    |  [ Proxmox VM / Host ]                                                            |
    |       |                                                                           |
    |       +--> KinD Kubernetes Cluster                                                |
    |               |                                                                   |
    |               +--> Namespace: jenkins (Controller + JCasC)                        |
    |               |       |                                                           |
    |               |       +--> Ephemeral Agent Pod (Created on-demand per build)      |
    |               |                 |                                                 |
    |               |                 +--> Builds Docker Image & Pushes to Registry:5001 |
    |               |                 +--> Deploys to Namespace: sample-app            |
    |               |                                                                   |
    |               +--> Namespace: sample-app                                          |
    |                       +--> Nginx Web Service (Vivek Pod Platform Proj)           |
    +-----------------------------------------------------------------------------------+
          </div>
        </div>

        <footer>
          <p>QuadGen Platform Engineer Assessment &copy; 2026 | Developed by Vivek</p>
        </footer>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web-app
  namespace: sample-app
  labels:
    app: sample-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web-app
  template:
    metadata:
      labels:
        app: sample-web-app
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: html-volume
        configMap:
          name: vivek-pod-platform-html
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web-service
  namespace: sample-app
spec:
  type: NodePort
  selector:
    app: sample-web-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
