apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: jenkins-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-plugins
          image: jenkins/jenkins:lts-jdk17
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - "sh"
            - "-c"
            - |
              echo "Installing plugins via jenkins-plugin-cli..."
              jenkins-plugin-cli --plugin-file /var/jenkins_config/plugins.txt --plugin-download-directory /usr/share/jenkins/ref/plugins --latest true || true
          volumeMounts:
            - name: jenkins-plugins-config
              mountPath: /var/jenkins_config
            - name: jenkins-plugins-dir
              mountPath: /usr/share/jenkins/ref/plugins
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_casc/jenkins.yaml
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP= -Djenkins.security.FrameOptionsFilter.allowFrom="
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: jnlp
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: jenkins-casc-config
              mountPath: /var/jenkins_casc
            - name: jenkins-plugins-dir
              mountPath: /usr/share/jenkins/ref/plugins
      volumes:
        - name: jenkins-home
          emptyDir: {}
        - name: jenkins-casc-config
          configMap:
            name: jenkins-casc-config
        - name: jenkins-plugins-config
          configMap:
            name: jenkins-plugins-config
        - name: jenkins-plugins-dir
          emptyDir: {}
